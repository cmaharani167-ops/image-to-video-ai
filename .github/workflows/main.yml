       name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p buildapp/app/src/main/java/com/imagetovideo
          mkdir -p buildapp/app/src/main/res/values

          cat > buildapp/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ImageToVideoGemini"
          include(":app")
          EOF

          cat > buildapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > buildapp/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.imagetovideo'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.imagetovideo'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > buildapp/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Image To Video AI"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > buildapp/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > buildapp/app/src/main/java/com/imagetovideo/MainActivity.java <<'EOF'
          package com.imagetovideo;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              LinearLayout root;
              TextView selected;
              EditText prompt;
              EditText server;
              Uri imageUri;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(35,35,35,35);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🎬 Image To Video AI");
                  title.setTextSize(27);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(-1,100));

                  Button choose = new Button(this);
                  choose.setText("📷 Pilih Gambar");
                  root.addView(choose);

                  selected = new TextView(this);
                  selected.setText("Belum ada gambar");
                  selected.setPadding(10,20,10,20);
                  root.addView(selected);

                  prompt = new EditText(this);
                  prompt.setHint("Contoh: kamera bergerak perlahan, rambut tertiup angin...");
                  prompt.setMinLines(3);
                  root.addView(prompt);

                  server = new EditText(this);
                  server.setHint("URL backend, contoh: https://server-kamu.com");
                  root.addView(server);

                  Button generate = new Button(this);
                  generate.setText("✨ GENERATE VIDEO");
                  root.addView(generate);

                  TextView info = new TextView(this);
                  info.setText("\nGunakan backend untuk menjaga Gemini API Key tetap aman.");
                  info.setTextColor(Color.DKGRAY);
                  root.addView(info);

                  choose.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.setType("image/*");
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      startActivityForResult(i, 100);
                  });

                  generate.setOnClickListener(v -> {
                      if (imageUri == null) {
                          Toast.makeText(this, "Pilih gambar dulu", Toast.LENGTH_SHORT).show();
                          return;
                      }

                      if (server.getText().toString().trim().isEmpty()) {
                          Toast.makeText(this, "Masukkan URL backend", Toast.LENGTH_SHORT).show();
                          return;
                      }

                      Toast.makeText(this,
                          "Permintaan video dikirim ke backend",
                          Toast.LENGTH_LONG).show();
                  });

                  setContentView(root);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      imageUri = data.getData();
                      selected.setText("Gambar dipilih ✓");
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: buildapp
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVideoGemini-APK
          path: buildapp/app/build/outputs/apk/release/app-release.apk
